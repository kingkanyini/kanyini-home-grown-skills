# Bootstrap template for the client hub note (frontmatter contract).
# Bootstrap writes one of two paths depending on chosen layout:
#   - Folder layout:      context/clients/[slug]/index.md
#   - Flat-client layout: context/clients/[slug]-client.md
# Used by /inbox-digest [slug] --bootstrap
#
# IMPORTANT validation rules (enforced by Phase 1):
#   - slug MUST match regex ^[a-z0-9][a-z0-9-]{0,40}$ (CIPHER-F2 patch)
#   - gmail_label MUST start with "Clients/" prefix (CIPHER-F5 patch)
#
# Placeholder note:
#   - {{label_slug}} = PascalCase of slug (e.g., "example-client" → "ExampleClient"). Derived by bootstrap, not entered manually.
#
# Replace {{placeholders}} with actual values during /inbox-digest --bootstrap.
# The leading frontmatter block is YAML; everything below the second --- is markdown body.
---
client: "{{display_name}}"             # e.g., "<example-client>"
slug: "{{slug}}"                       # e.g., "example-client"
status: active                         # active | paused | archived
gmail_accounts:                        # v1: informational only. v2: scan-routing (which accounts to query for this client).
  - "{{primary_account}}"              # e.g., <your-email>
email_addresses:                       # exact From-header match
  - "{{primary_email}}"
domains:                               # From-header domain match
  - "{{primary_domain}}"
aliases:                               # match in subject OR body (relay senders + self-notes)
  - "{{display_name}}"
relay_senders:                         # trusted third-party senders (file when subject/body matches an alias)
  - no-reply@zoom.us
  - calendar-notification@google.com
match_strategy: any                    # OR-logic across all match channels
gmail_label: "Clients/{{label_slug}}"  # e.g., Clients/ExampleClient — auto-applied as side-effect
last_scan: null                        # ISO 8601; updated atomically at end of Phase 2
priority: medium                       # high | medium | low — feeds counsel weighting (Sprint 2)
backfill_confirm_threshold: 100        # Phase 1 prompts before scanning more than this many threads
---

# {{display_name}}

<!-- Hub note for this client. Polished synthesis lives here. Raw email arrives in inbox/. -->
