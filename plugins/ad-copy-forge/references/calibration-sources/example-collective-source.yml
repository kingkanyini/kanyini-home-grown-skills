              - listitem [ref=e214]:
                - generic [ref=e215]: 
                - generic [ref=e216]: You're successful on paper, but something fundamental is missing. Revenue is there but you continue to hit a ceiling. And underneath all of it, there's a tension you can't name and can't think your way out of.
              - listitem [ref=e217]:
                - generic [ref=e218]: 
                - generic [ref=e219]:
                  - generic [ref=e220]: You live in your head, and experience chronic pain in the body.
                  - text: You're analytically sharp, but your body is in pain and you just got used to it. You're leading your business, your team, your relationships from a place you can't actually inhabit.
              - listitem [ref=e221]:
                - generic [ref=e222]: 
                - generic [ref=e223]: Your nervous system is always on. Even when you have time off, you struggle being present. You're there, but you struggle to find the switch to just relax.
              - listitem [ref=e224]:
                - generic [ref=e225]: 
                - generic [ref=e226]: You override the signals. Tight jaw. Shallow breathing. Poor sleep. Gut that protests. Your body is telling you something is wrong but you push through.
              - listitem [ref=e227]:
                - generic [ref=e228]: 
                - generic [ref=e229]: You've done the programs. More discipline. More frameworks. More self-help. Some of it helped. But you can't pull yourself to let go of responsibility.
              - listitem [ref=e230]:
                - generic [ref=e231]: 
                - generic [ref=e232]: You swing between control and shutdown. Either managing your inner state with an iron grip, or going numb. Neither is mastery. Both cost you connection.
