<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webinar Forge — Companion</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <h1 id="current-title">Webinar Forge Companion</h1>
    <div id="breadcrumb"></div>
    <button id="examples-toggle" aria-expanded="false">Examples</button>
  </header>
  <main>
    <section id="slide-area">
      <img id="slide-image" alt="" />
      <div id="slide-caption"></div>
    </section>
    <aside id="examples-drawer" hidden>
      <h2>Example Moments</h2>
      <div id="examples-filter">
        <label><input type="checkbox" id="show-all-examples" /> Show all chapters</label>
      </div>
      <div id="examples-grid"></div>
    </aside>
  </main>
  <footer>
    <div id="hash-help">Hash navigation: <code>#ch1.sec1</code> through <code>#ch5.secN</code></div>
  </footer>
  <script>window.__DATA_PATH__ = "./data.json";</script>
  <script src="./app.js"></script>
</body>
</html>
