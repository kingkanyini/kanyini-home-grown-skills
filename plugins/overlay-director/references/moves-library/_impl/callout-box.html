<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        font-display: block; src: local('Inter'), url('./assets/Inter.var.woff2') format('woff2'); }
      /* colors from constants.js: CARD_TEAL #4FD6C8 */
      .od-callout { position: absolute; left: 8%; top: 40%; opacity: 0; }
      .od-callout .od-inner { transform-origin: left center; }
      .od-callout .od-box { display: inline-block; padding: 40px 54px; border-radius: 28px;
        border: 1px solid #4FD6C8; background: rgba(10,10,10,0.35); }
      .od-callout .od-label { font: 700 26px/1 'Inter', sans-serif; letter-spacing: .16em;
        text-transform: uppercase; color: #4FD6C8; margin-bottom: 18px; }
      .od-callout .od-figure { font: 800 120px/1 'Inter', sans-serif; color: #FFF; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="callout-box" data-start="0" data-duration="3.4"
         data-width="1920" data-height="1080">
      <div class="od-callout">
        <div class="od-inner">
          <div class="od-box">
            <div class="od-label">Time to first win</div>
            <div class="od-figure">7 days</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const HOLD = 2.8; const S = '[data-composition-id="callout-box"]';
      const inner = `${S} .od-inner`;
      tl.set(`${S} .od-callout`, { opacity: 1 });
      tl.fromTo(inner, { opacity: 0, scale: 0.9 },
                   { opacity: 1, scale: 1, duration: 0.42, ease: 'back.out(1.5)' }, 0);
      tl.to(inner, { opacity: 0, duration: 0.35, ease: 'power1.in' }, HOLD);
      tl.set(inner, { opacity: 0 }, HOLD + 0.35);   // hard-kill
      window.__timelines["callout-box"] = tl;
      document.fonts && document.fonts.ready && document.fonts.ready.then(() => {});
    </script>
  </body>
</html>
