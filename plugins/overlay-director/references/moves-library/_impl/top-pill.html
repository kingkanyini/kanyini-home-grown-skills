<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        font-display: block; src: local('Inter'), url('./assets/Inter.var.woff2') format('woff2'); }
      /* base top:5% so the timeline drops top 5%->7% (gate: styleDelta top) */
      .od-pill { position: absolute; top: 5%; left: 0; right: 0; margin: 0 auto; width: max-content;
        padding: 8px 18px; border-radius: 999px; background: rgba(247,240,228,0.18);
        border: 1px solid rgba(255,255,255,0.35); backdrop-filter: blur(10px);
        color: #241B14; font: 700 18px/1 'Inter', sans-serif; letter-spacing: .04em; opacity: 0; }
      .od-inner { display: inline-block; transform-origin: 50% 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="top-pill" data-start="0" data-duration="3.4"
         data-width="1920" data-height="1080">
      <div class="od-pill"><span class="od-inner">Level 7 · The Imagination Revolution</span></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const HOLD = 2.6; const S = '[data-composition-id="top-pill"]';
      // MOTION UPGRADE (Layer 1): POP / SCALE-POP. The pill is a badge -> "MTV pop" register.
      // Container keeps the seek-safe top drop (5%->7%, baked top) on a smooth power3.out for the
      // gate; the POP feel rides the INNER wrapper's back.out(1.4) scale overshoot (0.8->1), so the
      // container position stays baked (§0). back.out adds a distinct ease vs the SMOOTH moves.
      tl.set(`${S} .od-pill`, { opacity: 0, top: '5%' });
      tl.set(`${S} .od-inner`, { scale: 0.8, transformOrigin: '50% 50%' });
      tl.to(`${S} .od-pill`, { opacity: 1, top: '7%', duration: 0.4, ease: 'power3.out' }, 0);
      tl.to(`${S} .od-inner`, { scale: 1, duration: 0.4, ease: 'back.out(1.4)' }, 0);   // POP settle
      tl.to(`${S} .od-pill`, { opacity: 0, duration: 0.35, ease: 'power1.in' }, HOLD);
      tl.set(`${S} .od-pill`, { opacity: 0 }, HOLD + 0.35);
      window.__timelines["top-pill"] = tl;
      document.fonts && document.fonts.ready && document.fonts.ready.then(() => {});
    </script>
  </body>
</html>
