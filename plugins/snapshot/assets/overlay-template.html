<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snapshot Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     CONFIG — edit ONLY this block per render
     ============================================================ */
  :root {
    --bg: url('bg.png');              /* MUST be copied into serve dir, native res */
    --title-size: 90px;              /* >=90px for thumbnails; tune up/down per preset at render time */
    --title-line-height: 1.06;
    --title-weight: 700;
    --title-color: #fdf8ee;          /* warm cream */
    --title-font: 'Cormorant Garamond', Georgia, serif;
    --box-width: 70%;                /* width of the text block */
    --scrim: rgba(18,22,16,0.46);    /* set to transparent to disable */
    --carrier: #111;                 /* opaque fallback behind bg — never transparent */
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--bg) center / cover no-repeat var(--carrier);
    font-family: var(--title-font);
    display: flex;                   /* default = centered */
    align-items: center;
    justify-content: center;
  }
  .title {
    width: var(--box-width);
    color: var(--title-color);
    font-size: var(--title-size);
    line-height: var(--title-line-height);
    font-weight: var(--title-weight);
    text-align: center;
    background: var(--scrim);
    padding: 0.45em 0.7em;
    border-radius: 18px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.7), 0 1px 3px rgba(0,0,0,0.85);
  }
  .title .accent { font-style: italic; }

  /* ---- treatments (switch via body[data-treatment]) ---- */
  body[data-treatment="top-band"] { align-items: flex-start; }
  body[data-treatment="top-band"] .title {
    width: 100%; text-align: center; border-radius: 0;
    padding: 0.5em 0.8em;
  }
  body[data-treatment="lower-third"] { align-items: flex-end; }
  body[data-treatment="lower-third"] .title {
    width: 100%; text-align: left; border-radius: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.78));
    padding: 1.2em 1em 0.8em;
  }
</style>
</head>
<body data-treatment="centered">
  <div class="title">YOUR TITLE HERE</div>
</body>
</html>
