<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        font-display: block; src: local('Inter'), url('./assets/Inter.var.woff2') format('woff2'); }
      /* colors from constants.js: CARD_LIME #C6F94E, CARD_TEAL #4FD6C8 */
      .od-pipeline { position: absolute; left: 6%; top: 34%; width: 62%; opacity: 0; }
      .od-pipeline .od-kicker { font: 700 26px/1 'Inter', sans-serif; letter-spacing: .2em;
        text-transform: uppercase; color: #C6F94E; margin-bottom: 30px; }
      .od-pipeline .od-stages { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 20px; }
      .od-pipeline .od-stage { position: relative; padding: 30px 26px; border-radius: 14px;
        background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); opacity: 0; }
      .od-pipeline .od-topbar { position: absolute; left: 0; top: 0; height: 4px; width: 100%;
        border-radius: 14px 14px 0 0; transform-origin: left center; transform: scaleX(0); background: #C6F94E; }
      .od-pipeline .od-stage.pending .od-topbar { background: #4FD6C8; }
      .od-pipeline .od-idx { font: 700 20px/1 'Inter', sans-serif; letter-spacing: .12em;
        color: rgba(255,255,255,0.45); text-transform: uppercase; }
      .od-pipeline .od-label { font: 700 34px/1.1 'Inter', sans-serif; color: #FFF; margin-top: 12px; }
      .od-pipeline .od-pill { display: inline-flex; align-items: center; gap: 12px; margin-top: 34px;
        padding: 14px 26px; border-radius: 999px; border: 1px solid #C6F94E;
        font: 700 24px/1 'Inter', sans-serif; letter-spacing: .1em; color: #C6F94E;
        text-transform: uppercase; opacity: 0; }
      .od-pipeline .od-pill .od-dot { width: 12px; height: 12px; border-radius: 50%; background: #C6F94E; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="pipeline-build" data-start="0" data-duration="4.4"
         data-width="1920" data-height="1080">
      <div class="od-pipeline">
        <div class="od-kicker">&bull; One run. Four agents.</div>
        <div class="od-stages">
          <div class="od-stage"><div class="od-topbar"></div><div class="od-idx">Agent 01</div><div class="od-label">Research</div></div>
          <div class="od-stage"><div class="od-topbar"></div><div class="od-idx">Agent 02</div><div class="od-label">Script</div></div>
          <div class="od-stage pending"><div class="od-topbar"></div><div class="od-idx">Agent 03</div><div class="od-label">Production</div></div>
          <div class="od-stage pending"><div class="od-topbar"></div><div class="od-idx">Agent 04</div><div class="od-label">Verify</div></div>
        </div>
        <div class="od-pill"><span class="od-dot"></span>Coordinating</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const HOLD = 3.4; const S = '[data-composition-id="pipeline-build"]';
      const root = document.querySelector(S);
      const stages = root.querySelectorAll('.od-stage');
      tl.set(`${S} .od-pipeline`, { opacity: 1 });
      stages.forEach((s, i) => {
        const at = i * 0.14, top = s.querySelector('.od-topbar');
        tl.fromTo(s, { opacity: 0, scale: 0.92 },
                     { opacity: 1, scale: 1, duration: 0.4, ease: 'power3.out' }, at);
        tl.to(top, { scaleX: 1, duration: 0.35, ease: 'power2.out' }, at + 0.1);
      });
      const end = stages.length * 0.14 + 0.2;
      tl.fromTo(`${S} .od-pill`, { opacity: 0, scale: 0.8 },
                   { opacity: 1, scale: 1, duration: 0.4, ease: 'back.out(1.6)' }, end);
      tl.to(`${S} .od-pipeline`, { opacity: 0, duration: 0.4, ease: 'power1.in' }, HOLD);
      tl.set(`${S} .od-pipeline`, { opacity: 0 }, HOLD + 0.4);   // hard-kill
      window.__timelines["pipeline-build"] = tl;
      document.fonts && document.fonts.ready && document.fonts.ready.then(() => {});
    </script>
  </body>
</html>
