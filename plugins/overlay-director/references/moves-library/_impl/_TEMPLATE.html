<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      /* Local font, bundled — no network fetch (determinism) */
      @font-face {
        font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        font-display: block; src: local('Inter'), url('./assets/Inter.var.woff2') format('woff2');
      }
      /* @@EFFECT_CSS@@  — paste the card's `## CSS` block verbatim here */
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="@@MOVE_ID@@" data-start="0" data-duration="@@DURATION@@"
         data-width="1920" data-height="1080">
      <!-- @@EFFECT_MARKUP@@ — the effect's element(s), classes only, no #id -->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });   // synchronous registration
      /* @@EFFECT_TIMELINE@@ — beats at local t=0, selectors scoped to [data-composition-id] .od-* */
      window.__timelines["@@MOVE_ID@@"] = tl;        // key === root data-composition-id (NOT 'root')
      // First visual application may await fonts; registration above is already done.
      document.fonts && document.fonts.ready && document.fonts.ready.then(() => {});
    </script>
  </body>
</html>
