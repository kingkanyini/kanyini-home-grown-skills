<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        font-display: block; src: local('Inter'), url('./assets/Inter.var.woff2') format('woff2'); }
      .od-stack { position: absolute; left: 8%; top: 22%; width: 38%;
        display: flex; flex-direction: column; gap: 12px; opacity: 1; }
      /* position:relative so the per-item `left` reveal offset is visible */
      .od-item { position: relative; padding: 14px 20px; border-radius: 18px; background: rgba(247,240,228,0.16);
        border: 1px solid rgba(255,255,255,0.35); backdrop-filter: blur(12px); color: #241B14;
        font: 600 24px/1.2 'Inter', sans-serif; opacity: 0; }
      .od-item .od-num { color: #B06A3B; font-weight: 800; margin-right: 10px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="sandwich-stack" data-start="0" data-duration="4.2"
         data-width="1920" data-height="1080">
      <div class="od-stack">
        <div class="od-item od-item-1"><span class="od-num">1</span>Notice the trigger.</div>
        <div class="od-item od-item-2"><span class="od-num">2</span>Hit the ESC button. Breathe.</div>
        <div class="od-item od-item-3"><span class="od-num">3</span>Choose your next move.</div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const HOLD = 3.4; const S = '[data-composition-id="sandwich-stack"]'; const beats = [0, 0.3, 0.6];
      tl.set(`${S} .od-stack`, { opacity: 1 });
      ['.od-item-1', '.od-item-2', '.od-item-3'].forEach((c, i) => {
        tl.set(`${S} ${c}`, { opacity: 0, left: '6%' });
        tl.to(`${S} ${c}`, { opacity: 1, left: '0%', duration: 0.35, ease: 'power2.out' }, beats[i]);
      });
      tl.to(`${S} .od-stack`, { opacity: 0, duration: 0.4, ease: 'power1.in' }, HOLD);
      tl.set(`${S} .od-stack`, { opacity: 0 }, HOLD + 0.4);
      window.__timelines["sandwich-stack"] = tl;
      document.fonts && document.fonts.ready && document.fonts.ready.then(() => {});
    </script>
  </body>
</html>
