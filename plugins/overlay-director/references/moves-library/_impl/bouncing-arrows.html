<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        font-display: block; src: local('Inter'), url('./assets/Inter.var.woff2') format('woff2'); }
      .od-arrow { position: absolute; left: calc(50% - 44px); top: 44%; width: 88px; height: 88px; color: #D9A05B;
        filter: drop-shadow(2px 3px 6px rgba(20,14,9,0.5)); opacity: 0; transform-origin: 50% 50%; }
      .od-arrow svg { width: 100%; height: 100%; display: block; }
      .od-target { position: absolute; left: 0; right: 0; margin: 0 auto; top: 56%; width: max-content;
        padding: 12px 28px; border-radius: 999px; background: rgba(247,240,228,0.16);
        border: 1px solid rgba(255,255,255,0.4); backdrop-filter: blur(10px);
        color: #F7F0E4; font: 700 24px/1 'Inter', sans-serif; letter-spacing: .08em; opacity: 0; transform-origin: 50% 50%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="bouncing-arrows" data-start="0" data-duration="3.2"
         data-width="1920" data-height="1080">
      <div class="od-target">PRESS START</div>
      <div class="od-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const HOLD = 2.4; const S = '[data-composition-id="bouncing-arrows"]';
      // MOTION UPGRADE (Layer 1): POP / SCALE-POP entrance. The accent now pops in on back.out(1.4)
      // (0.8->1 scale) — the playful "look here" register — then the finite yoyo bounce carries the
      // hold (gate: yExtrema range > 4px). Bounce is a y-transform on top of the settled scale; base
      // position stays baked via left/top (§0). Math.floor per seek-safety (never round/ceil).
      tl.set([`${S} .od-arrow`, `${S} .od-target`], { opacity: 0, scale: 0.8, transformOrigin: '50% 50%' })
        .set(`${S} .od-arrow`, { y: 0 });
      tl.to(`${S} .od-target`, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.4)' }, 0);
      tl.to(`${S} .od-arrow`, { opacity: 1, scale: 1, duration: 0.35, ease: 'back.out(1.4)' }, 0);
      tl.to(`${S} .od-arrow`, { y: -14, duration: 0.5, ease: 'sine.inOut', yoyo: true,
        repeat: Math.max(1, Math.floor(HOLD / 0.5)) }, 0);   // bounce runs through the hold (y rides on top of the settled scale)
      tl.to([`${S} .od-arrow`, `${S} .od-target`], { opacity: 0, duration: 0.3, ease: 'power1.in' }, HOLD);
      tl.set([`${S} .od-arrow`, `${S} .od-target`], { opacity: 0 }, HOLD + 0.3);
      tl.set(`${S} .od-arrow`, { y: 0 }, HOLD + 0.3);
      window.__timelines["bouncing-arrows"] = tl;
      document.fonts && document.fonts.ready && document.fonts.ready.then(() => {});
    </script>
  </body>
</html>
