<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      @font-face { font-family: 'Inter'; font-style: normal; font-weight: 100 900;
        font-display: block; src: local('Inter'), url('./assets/Inter.var.woff2') format('woff2'); }
      /* container baked at DESTINATION preset: left-third-hero (5% / 30% / 30%) */
      .od-pip { position: absolute; left: 5%; top: 30%; width: 30%; }
      .od-pip .od-pip-inner { transform-origin: top left; width: 100%; aspect-ratio: 4 / 5; }
      .od-pip .od-frame { width: 100%; height: 100%; border-radius: 20px; overflow: hidden;
        background: #16181C; border: 1px solid rgba(255,255,255,0.12);
        display: flex; align-items: center; justify-content: center; }
      .od-pip .od-ph { font: 700 26px/1 'Inter', sans-serif; letter-spacing: .16em;
        text-transform: uppercase; color: rgba(255,255,255,0.35); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="pip-reframe" data-start="0" data-duration="3.0"
         data-width="1920" data-height="1080">
      <div class="od-pip">
        <div class="od-pip-inner">
          <div class="od-frame"><span class="od-ph">Presenter</span></div>
        </div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const S = '[data-composition-id="pip-reframe"]';
      const inner = `${S} .od-pip-inner`;
      // presets in px for a 1920x1080 canvas
      const PIP = { 'top-right-box': { l: 1382, t: 65, w: 422 },
                    'left-third-hero': { l: 96, t: 324, w: 576 },
                    'over-screenrec': { l: 1440, t: 670, w: 384 } };
      const from = PIP['top-right-box'], to = PIP['left-third-hero'];   // container baked at `to`
      const dx = from.l - to.l, dy = from.t - to.t, scale = from.w / to.w;
      tl.set(inner, { x: dx, y: dy, scale });                          // start at source pose (top-right-box)
      tl.to(inner, { x: 0, y: 0, scale: 1, duration: 0.6, ease: 'power3.out' }, 0.8);  // glide into destination
      // persistent PIP: no exit in production. A gentle hard-kill closes the self-contained demo.
      tl.set(inner, { x: 0, y: 0, scale: 1 }, 2.9);
      window.__timelines["pip-reframe"] = tl;
      document.fonts && document.fonts.ready && document.fonts.ready.then(() => {});
    </script>
  </body>
</html>
